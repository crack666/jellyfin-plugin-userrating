name: "User Rating"
guid: "7e3c9a12-4b8f-4d71-9e2a-1c5f8b0d4a33"
version: "1.3.0.1"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Import your IMDb ratings, and see which rated titles are missing from your library"
description: >-
  Imports an IMDb "Your Ratings" export into UserData.Rating and reports every
  rated title that is not in the library, sorted by your own score and
  exportable as CSV. Also surfaces the rating in the stock web UI: sort, poster
  badge, editable detail score. No jellyfin-web fork.
  https://github.com/crack666/jellyfin-plugin-userrating
category: "General"
owner: "crack666"
imageUrl: "https://raw.githubusercontent.com/crack666/jellyfin-plugin-userrating/master/docs/logo.png"
artifacts:
- "Jellyfin.Plugin.UserRating.dll"
# Only the current version belongs here: jprm copies this verbatim into the
# repository manifest, and manifest entries are append-only. History lives in
# CHANGELOG.md.
changelog: |
  - Fixes the white "Unexpected Application Error" screen on Jellyfin 12.3: the personal-rating
    sort emptied a React-owned icon in the sort menu, and the next render tore the app down.
  - Personal-rating sort works again on 12.3. The server now sorts SortBy=UserRating itself, so
    it no longer depends on the web app fetching its library through window.fetch.
  - Picking "Personal rating" applies immediately instead of only after leaving the view.
